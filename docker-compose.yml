services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_api_gateway
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=config.yaml
      - REDIS_ADDR=redis:6379
      - VECTOR_SERVICE_ADDR=vector_service:50051
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: gateway_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: gateway_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: always

  vector_service:
    build:
      context: .
      dockerfile: cmd/vector_service/Dockerfile
    container_name: vector_service
    ports:
      - "50051:50051"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_password
      - POSTGRES_DB=rag_db
    depends_on:
      - postgres
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_password
      - POSTGRES_DB=rag_db
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init_vector_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always



